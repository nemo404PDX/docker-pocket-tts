name: tests

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: pytest (CPU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements/cpu_requirements.txt
            requirements/dev_requirements.txt

      # CPU-only torch index keeps the install small (matches deploy/Dockerfile).
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/cpu_requirements.txt -r requirements/dev_requirements.txt

      - name: Run tests
        run: pytest tests/ -q
