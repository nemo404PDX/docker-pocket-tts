services:
  docker-pocket-tts:
    container_name: pocket-tts-local
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      # Host port must match POCKET_TTS_PORT in ../.env (default 49112).
      - "49112:49112"
    env_file:
      - ../.env
    environment:
      # Container-internal paths only — user-facing settings live in ../.env.
      POCKET_TTS_MODEL_CACHE_DIR: /data/models/pocket-tts
      POCKET_TTS_VOICES_DIR: /data/voices
      # stdout-only logging: Docker's log driver (below) captures and rotates it.
      # Set POCKET_TTS_LOG_TO_FILE=true in ../.env to also write file logs, but
      # note there is no /data/logs volume by default — they'd live in the image fs.
      POCKET_TTS_LOG_TO_FILE: "false"
      # Where the app looks for the HF token inside the container (see tts.py).
      HF_TOKEN_FILE: /run/secrets/hf_token
    volumes:
      - ../data/models:/data/models
      - ../data/voices:/data/voices
      # Host path to the HF token file; override with HF_TOKEN_FILE=<path> in your
      # shell env (or a deploy/.env) if it lives elsewhere.
      - ${HF_TOKEN_FILE:-C:\Users\nemo\.secrets\hf_token}:/run/secrets/hf_token:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:49112/health', timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
